services:
  umami:
    image: ghcr.io/umami-software/umami:3
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?reload New project to link a Postgres database, or send link_databases with env_prefix DATABASE}
      APP_SECRET: ${APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
