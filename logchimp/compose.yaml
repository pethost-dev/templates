services:
  cache:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    command: [ "valkey-server", "--save", "60", "1", "--loglevel", "warning", "--dir", "/data" ]
    volumes:
      - valkey-data:/data

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: maindb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres:/var/lib/postgresql/data

  migrator:
    image: ghcr.io/logchimp/logchimp/api:0.9.2
    command: [ "./scripts/migrate.sh" ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      LOGCHIMP_DB_HOST: db
      LOGCHIMP_DB_DATABASE: maindb
      LOGCHIMP_DB_PORT: 5432
      LOGCHIMP_DB_USER: admin
      LOGCHIMP_DB_PASSWORD: secret123

  api:
    image: ghcr.io/logchimp/logchimp/api:0.9.2
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8000
      LOGCHIMP_IS_SELF_HOSTED: true
      LOGCHIMP_SECRET_KEY: ${LOGCHIMP_SECRET_KEY}
      LOGCHIMP_WEB_URL: ${LOGCHIMP_WEB_URL}
      LOGCHIMP_LICENSE_KEY: ${LOGCHIMP_LICENSE_KEY}
      LOGCHIMP_SIGNATURE_TOKEN: ${LOGCHIMP_SIGNATURE_TOKEN}

      # Database
      LOGCHIMP_DB_HOST: db
      LOGCHIMP_DB_DATABASE: maindb
      LOGCHIMP_DB_PORT: 5432
      LOGCHIMP_DB_USER: admin
      LOGCHIMP_DB_PASSWORD: secret123
      LOGCHIMP_DB_SSL: false

      # Cache
      LOGCHIMP_VALKEY_URL: cache:6379

      # Mail
      LOGCHIMP_MAIL_HOST: ${LOGCHIMP_MAIL_HOST}
      LOGCHIMP_MAIL_USER: ${LOGCHIMP_MAIL_USER}
      LOGCHIMP_MAIL_PASSWORD: ${LOGCHIMP_MAIL_PASSWORD}
      LOGCHIMP_MAIL_PORT: ${LOGCHIMP_MAIL_PORT}
    ports:
      - "${API_PORT:-8000}:8000"

  theme:
    image: ghcr.io/logchimp/logchimp/theme:0.9.2
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_WEBAPP_URL: ${LOGCHIMP_WEB_URL}
      VITE_API_URL: ${VITE_API_URL}
      VITE_IS_SELF_HOSTED: true
    ports:
      - "${THEME_PORT:-3000}:3000"

volumes:
  valkey-data:
  postgres: