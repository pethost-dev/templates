services:
  kener:
    image: rajnandan1/kener:4.1.7
    restart: unless-stopped
    environment:
      KENER_SECRET_KEY: ${SECRET_KEY}
      ORIGIN: ${URL}
      # Kener's queues and scheduler, in the Valkey database linked to the project.
      REDIS_URL: ${REDIS_URL:?reload New project to link a Valkey database, or send link_databases with env_prefix REDIS}
      # The mail provider picked in New project, by STARTTLS on its port (SMTP_SECURE 0). With
      # none, these are empty and Kener sends no mail.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM}
      SMTP_SECURE: "0"
    volumes:
      # The SQLite database: monitors, their history, incidents and settings.
      - data:/app/database

volumes:
  data:
