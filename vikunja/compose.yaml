services:
  vikunja:
    image: vikunja/vikunja:2
    restart: unless-stopped
    # The image has nothing but Vikunja, so a volume comes up owned by root and Vikunja's
    # own user could not write to it.
    user: "0:0"
    environment:
      VIKUNJA_SERVICE_PUBLICURL: ${URL}/
      VIKUNJA_SERVICE_JWTSECRET: ${JWT_SECRET}
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      # Open until the first account is made; the notes say how to close it.
      VIKUNJA_SERVICE_ENABLEREGISTRATION: ${ENABLE_REGISTRATION:-true}
      # The mail provider picked in New project, by STARTTLS on its port. With none, the mailer
      # is off: accounts need no confirmation, and passwords are not reset by mail.
      VIKUNJA_MAILER_ENABLED: ${SMTP_ENABLED:-false}
      VIKUNJA_MAILER_HOST: ${SMTP_HOST}
      VIKUNJA_MAILER_PORT: ${SMTP_PORT:-587}
      VIKUNJA_MAILER_USERNAME: ${SMTP_USER}
      VIKUNJA_MAILER_PASSWORD: ${SMTP_PASSWORD}
      VIKUNJA_MAILER_FROMEMAIL: ${SMTP_FROM}
      VIKUNJA_MAILER_FORCESSL: "false"
    volumes:
      - files:/app/vikunja/files
      - db:/db

volumes:
  files:
  db:
